# main（または master）に push するたびに APK を作り、GitHub の Releases に置く。
# 最新版は https://github.com/<ユーザー名>/<リポジトリ名>/releases/latest/download/WintReader.apk からダウンロードできる。
# 署名の鍵はリポジトリの Settings → Secrets and variables → Actions に登録しておく：
#   SIGNING_KEYSTORE_BASE64（鍵ファイルを base64 にした文字列）・SIGNING_STORE_PASSWORD・SIGNING_KEY_ALIAS・SIGNING_KEY_PASSWORD
# 鍵が登録されていないときは、毎回違う標準のデバッグ鍵で署名される（その場合は更新のたびにアンインストールが必要）。
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wint.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/wint.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::署名の鍵（SIGNING_KEYSTORE_BASE64）が登録されていないため、標準のデバッグ鍵で署名します"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WintReader.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wint Reader 1.0.${{ github.run_number }}
          body: |
            `${{ github.sha }}` から作った APK です。
            スマホでこのページを開き、下の WintReader.apk を押すとダウンロードできます。
          files: WintReader.apk
          make_latest: true
